services:
  - type: web
    name: weatherops-backend
    runtime: python
    plan: standard
    branch: main
    buildCommand: bash ./backend/build.sh
    startCommand: cd backend && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: weatherops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: weatherops-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CELERY_BROKER_URL
        fromService:
          name: weatherops-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: weatherops-redis
          type: redis
          property: connectionString
      - key: CELERY_ACCEPT_CONTENT
        value: '["json"]'
      - key: CELERY_TASK_SERIALIZER
        value: json
      - key: CELERY_RESULT_SERIALIZER
        value: json
      - key: CELERY_TIMEZONE
        value: UTC
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  - type: worker
    name: weatherops-celery
    runtime: python
    plan: standard
    branch: main
    buildCommand: bash ./backend/build.sh
    startCommand: cd backend && celery -A app.tasks worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: weatherops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: weatherops-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_BROKER_URL
        fromService:
          name: weatherops-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: weatherops-redis
          type: redis
          property: connectionString

  - type: web
    name: weatherops-frontend
    runtime: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars: []

  - type: redis
    name: weatherops-redis
    plan: standard
    region: oregon

databases:
  - name: weatherops-db
    databaseName: weatherops
    plan: standard
    region: oregon
